<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSM業務フロー デモ</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#172b4d; --sub:#5e6c84; --line:#dfe1e6;
  --brand:#0c66e4; --brand-ink:#ffffff; --ok:#1f845a; --warn:#b65c02; --bad:#c9372c; --pause:#6e5dc6;
  --chip:#f1f2f4; --code:#f4f5f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d2125; --panel:#22272b; --ink:#dee4ea; --sub:#9fadbc; --line:#38414a;
    --brand:#579dff; --brand-ink:#1d2125; --ok:#4bce97; --warn:#f5cd47; --bad:#f87168; --pause:#9f8fef;
    --chip:#2c333a; --code:#161a1d;
  }
}
:root[data-theme="dark"]{
  --bg:#1d2125; --panel:#22272b; --ink:#dee4ea; --sub:#9fadbc; --line:#38414a;
  --brand:#579dff; --brand-ink:#1d2125; --ok:#4bce97; --warn:#f5cd47; --bad:#f87168; --pause:#9f8fef;
  --chip:#2c333a; --code:#161a1d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;margin-right:auto}
header h1 small{color:var(--sub);font-weight:normal;margin-left:6px}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums;font-weight:600}
nav{display:flex;gap:2px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;color:var(--sub);padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font:inherit}
nav button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px}
.card h3{font-size:14px;margin:16px 0 6px}
.muted{color:var(--sub)}
.small{font-size:12px}
button.b,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 9px}
button.b{cursor:pointer}
button.b:hover{border-color:var(--brand)}
button.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.d{color:var(--bad)}
textarea{width:100%;min-height:60px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-weight:600;margin-bottom:3px}
.form-row input,.form-row select{width:100%;max-width:420px}
.req{color:var(--bad);margin-left:3px}
.err{color:var(--bad);font-size:12px}
.notice{border-left:3px solid var(--brand);background:var(--chip);padding:6px 10px;border-radius:0 4px 4px 0;margin:8px 0;font-size:13px}
.notice.warn{border-color:var(--warn)}
.types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.types button{flex:1 1 160px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.types button.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.types b{display:block}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600}
tr.sel td{background:var(--chip)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--chip)}
.tbl{overflow-x:auto}
.st{display:inline-block;padding:0 7px;border-radius:3px;font-size:12px;font-weight:600;background:var(--chip);white-space:nowrap}
.st-承認待ち{color:var(--warn)} .st-差戻し{color:var(--bad)} .st-却下{color:var(--sub);text-decoration:line-through}
.st-未着手{color:var(--sub)} .st-対応中{color:var(--brand)} .st-回答待ち{color:var(--pause)} .st-完了{color:var(--ok)}
.sla{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;border:1px solid currentColor;margin:1px 2px 1px 0;white-space:nowrap}
.sla.ok{color:var(--ok)} .sla.warn{color:var(--warn)} .sla.bad{color:var(--bad);font-weight:700} .sla.pause{color:var(--pause)} .sla.stop{color:var(--sub)}
code,.jql{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--code);padding:1px 5px;border-radius:3px}
.jql{display:block;padding:6px 8px;margin:4px 0 10px;white-space:pre-wrap;word-break:break-all}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;margin:8px 0}
.kv dt{color:var(--sub)}
.kv dd{margin:0;word-break:break-word}
.steps{list-style:none;padding:0;margin:6px 0}
.steps li{padding:4px 0;border-bottom:1px dashed var(--line)}
.act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--sub);font-size:12px}
.kpi.bad .n{color:var(--bad)}
.bar{display:grid;grid-template-columns:90px 1fr 120px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar .track{background:var(--chip);border-radius:3px;height:14px;overflow:hidden}
.bar .fill{background:var(--brand);height:100%}
.log{max-height:260px;overflow:auto;font-size:12px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.rule{font-weight:600;color:var(--brand)}
.hist{font-size:12px}
.empty{color:var(--sub);padding:20px;text-align:center}
svg text{fill:var(--ink);font-size:12px;font-family:inherit}
svg .box{fill:var(--panel);stroke:var(--sub)}
svg .ln{stroke:var(--sub);fill:none}
svg .lb{fill:var(--sub);font-size:10px}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>JSM 業務フロー デモ<small>申請・承認 / 自動割当 / SLA / 可視化</small></h1>
  <div class="ctl">
    <label class="muted small" for="userSel">表示ユーザー</label>
    <select id="userSel"></select>
  </div>
  <div class="ctl">
    <span class="muted small">シミュレーション時刻</span>
    <span class="clock" id="clock"></span>
    <button class="b" data-act="clock" data-h="1">+1時間</button>
    <button class="b" data-act="clock" data-h="8">+8時間</button>
    <button class="b d" data-act="reset">初期化</button>
  </div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>

<script>
'use strict';
/* ============================================================
   定数・マスタ定義（本番では Assets / グループ / カスタムフィールドに相当）
   ============================================================ */
const H = 3600e3;
const BASE = new Date('2026-11-09T09:00:00+09:00').getTime();
const STORE_KEY = 'jsm-demo-v1';

const USERS = {
  tanaka:   { name: '田中（申請者）',      roles: ['requester'] },
  sato:     { name: '佐藤 課長',           roles: ['approver'] },
  suzuki:   { name: '鈴木 部長',           roles: ['approver'] },
  kato:     { name: '加藤 課長代理',       roles: ['approver'] },
  yamamoto: { name: '山本（総務）',        roles: ['agent'] },
  kimura:   { name: '木村（デザイン）',    roles: ['agent'] },
  ito:      { name: '伊藤（開発・情シス）', roles: ['agent'] },
  admin:    { name: 'Jira管理者',          roles: ['admin', 'agent'] },
};
const ROLE_LABEL = { requester: '一般申請者', approver: '承認者', agent: '実行担当', admin: '管理者' };

/* 申請フォーム定義：項目・必須・条件表示をデータで保持（移行先でもそのまま仕様として使える形） */
const REQUEST_TYPES = {
  purchase: {
    name: '備品購入申請', desc: '10万円以上は部長承認を自動追加',
    fields: [
      { id: 'item',   label: '品目',            type: 'text',     req: true },
      { id: 'amount', label: '金額（税込・円）', type: 'number',   req: true },
      { id: 'reason', label: '購入理由',        type: 'textarea', req: true },
    ],
    summary: f => f.item,
  },
  production: {
    name: '制作依頼', desc: '承認後に工程別の子チケットを自動生成',
    fields: [
      { id: 'title',    label: '案件名',   type: 'text',   req: true },
      { id: 'media',    label: '媒体',     type: 'select', req: true, options: ['Web', '印刷', '動画'] },
      { id: 'duration', label: '尺（秒）', type: 'number', req: true, showIf: { field: 'media', eq: '動画' } },
      { id: 'due',      label: '希望納期', type: 'date',   req: true },
      { id: 'detail',   label: '概要',     type: 'textarea', req: false },
    ],
    summary: f => f.title,
  },
  account: {
    name: 'アカウント発行申請', desc: '対象システムで入力項目が変化',
    fields: [
      { id: 'system', label: '対象システム', type: 'select', req: true, options: ['Slack', 'GitHub', 'Jira'] },
      { id: 'repo',   label: 'リポジトリ名', type: 'text',   req: true, showIf: { field: 'system', eq: 'GitHub' } },
      { id: 'start',  label: '利用開始日',   type: 'date',   req: true },
    ],
    summary: f => `${f.system} アカウント発行`,
  },
};
const TYPE_NAME = t => t === 'task' ? '作業（子）' : REQUEST_TYPES[t].name;

const defaultMaster = () => ({
  approvers: { manager: 'sato', director: 'suzuki' },
  absent:    { sato: false, suzuki: false },
  proxy:     { sato: 'kato', suzuki: 'sato' },
  threshold: 100000,
  assign:    { purchase: 'yamamoto', account: 'ito', production: 'admin' },
  processes: { Web: ['デザイン', 'コーディング', '校正'], 印刷: ['デザイン', '入稿データ作成', '校正'], 動画: ['構成', '編集', '校正'] },
  processAssign: { デザイン: 'kimura', コーディング: 'ito', 校正: 'yamamoto', 入稿データ作成: 'kimura', 構成: 'kimura', 編集: 'ito' },
  sla: { approvalH: 8, resolveH: 24 },
});

const OPEN = ['承認待ち', '差戻し', '未着手', '対応中', '回答待ち'];
const STATUSES = ['承認待ち', '差戻し', '未着手', '対応中', '回答待ち', '完了', '却下'];

/* ============================================================
   状態
   ============================================================ */
let S;          // 永続化する業務データ
const ui = { user: 'tanaka', tab: 'portal', sel: null, formType: 'purchase', form: {}, errors: [], edit: null, flash: '' };

const uname = id => id === 'automation' ? 'Automation' : (USERS[id]?.name ?? id);
const has = (u, r) => USERS[u].roles.includes(r);
const find = key => S.tickets.find(t => t.key === key);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = ms => new Date(ms).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtDur = ms => { const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60); return h ? `${h}h${m % 60 ? (m % 60) + 'm' : ''}` : `${m}m`; };
const yen = n => Number(n).toLocaleString('ja-JP') + '円';

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { S = JSON.parse(raw); return true; } } catch (e) {}
  return false;
}

/* ============================================================
   Automation ルール（本番では Jira Automation で実装する内容）
   ============================================================ */
function autolog(t, rule, msg) { S.autolog.push({ at: S.now, key: t ? t.key : '-', rule, msg }); }

function transition(t, to, by, note) {
  t.history.push({ at: S.now, from: t.status, to, by, note: note || '' });
  t.status = to;
}

function visibleFields(type, values) {
  return REQUEST_TYPES[type].fields.filter(f => !f.showIf || values[f.showIf.field] === f.showIf.eq);
}
function validate(type, values) {
  const errs = [];
  for (const f of visibleFields(type, values)) {
    const v = values[f.id];
    if (f.req && (v === undefined || String(v).trim() === '')) errs.push(`${f.label} は必須です`);
    if (f.type === 'number' && v !== undefined && v !== '' && !(Number(v) > 0)) errs.push(`${f.label} は正の数値で入力してください`);
  }
  return errs;
}
function cleanValues(type, values) {
  const out = {};
  for (const f of visibleFields(type, values)) out[f.id] = f.type === 'number' ? Number(values[f.id]) : (values[f.id] ?? '');
  return out;
}

// A1: 承認経路の自動設定（条件分岐）
function buildSteps(t) {
  const steps = [{ label: '課長承認', role: 'manager' }];
  if (t.type === 'purchase' && Number(t.fields.amount) >= S.master.threshold) {
    steps.push({ label: '部長承認', role: 'director' });
    autolog(t, 'A1 承認経路設定', `金額 ${yen(t.fields.amount)} ≥ 閾値 ${yen(S.master.threshold)} のため部長承認を追加`);
  } else {
    autolog(t, 'A1 承認経路設定', '課長承認のみ');
  }
  return steps.map(s => ({ ...s, approver: null, onBehalf: null, decision: null, at: null, comment: '' }));
}
// A2: 承認者の解決（不在時は代理承認者へ）+ A3 通知
function activateStep(t) {
  const s = t.approvals[t.approvalIdx];
  const uid = S.master.approvers[s.role];
  if (S.master.absent[uid] && S.master.proxy[uid] && S.master.proxy[uid] !== uid) {
    s.approver = S.master.proxy[uid]; s.onBehalf = uid;
    autolog(t, 'A2 代理承認', `${uname(uid)} が不在のため ${uname(s.approver)} へ回付`);
  } else {
    s.approver = uid;
  }
  autolog(t, 'A3 通知', `${s.label}の依頼を ${uname(s.approver)} へ通知（メール/Slack）`);
}
function setupApprovals(t) {
  if (t.approvals?.length) t.pastApprovals.push(...t.approvals.map(a => ({ ...a, round: t.round })));
  t.approvals = buildSteps(t); t.approvalIdx = 0; activateStep(t);
}
// A4: 担当者自動割当（マスタ参照）/ 制作依頼は子チケット生成
function onApproved(t) {
  transition(t, '未着手', 'automation', '全承認完了');
  t.assignee = S.master.assign[t.type];
  autolog(t, 'A4 自動割当', `マスタ[${TYPE_NAME(t.type)}] → ${uname(t.assignee)}`);
  if (t.type === 'production') {
    const procs = S.master.processes[t.fields.media] || [];
    for (const p of procs) {
      const c = newTicket('task', { 工程: p }, 'automation');
      c.summary = `${t.summary}／${p}`;
      c.parent = t.key;
      c.assignee = S.master.processAssign[p];
      transition(c, '未着手', 'automation', '親チケット承認により生成');
      t.children.push(c.key);
    }
    autolog(t, 'A5 子チケット生成', `媒体=${t.fields.media} の工程マスタから ${procs.length} 件生成（${procs.join('・')}）`);
    transition(t, '対応中', 'automation', '子チケット生成済み');
  }
}

function newTicket(type, fields, by) {
  const t = {
    key: 'REQ-' + (++S.seq), type, fields, reporter: by, status: null, created: S.now,
    summary: type === 'task' ? '' : REQUEST_TYPES[type].summary(fields),
    history: [], approvals: [], pastApprovals: [], approvalIdx: 0, round: 1,
    assignee: null, parent: null, children: [], comments: [],
  };
  S.tickets.push(t);
  return t;
}

/* ---- 業務アクション ---- */
const A = {
  create(type, values, by) {
    const t = newTicket(type, cleanValues(type, values), by);
    transition(t, '承認待ち', by, '申請');
    setupApprovals(t);
    return t;
  },
  approve(t, by, comment) {
    const s = t.approvals[t.approvalIdx];
    Object.assign(s, { decision: '承認', at: S.now, comment: comment || '', actual: by });
    t.comments.push({ at: S.now, by, text: `【${s.label}・承認】${comment || ''}` });
    if (t.approvalIdx + 1 < t.approvals.length) { t.approvalIdx++; activateStep(t); }
    else onApproved(t);
  },
  sendBack(t, by, comment) {
    const s = t.approvals[t.approvalIdx];
    Object.assign(s, { decision: '差戻し', at: S.now, comment, actual: by });
    transition(t, '差戻し', by, comment);
    autolog(t, 'A3 通知', `申請者 ${uname(t.reporter)} へ差戻しを通知`);
  },
  reject(t, by, comment) {
    const s = t.approvals[t.approvalIdx];
    Object.assign(s, { decision: '却下', at: S.now, comment, actual: by });
    transition(t, '却下', by, comment);
    autolog(t, 'A3 通知', `申請者 ${uname(t.reporter)} へ却下を通知`);
  },
  resubmit(t, values, by) {
    t.fields = cleanValues(t.type, values);
    t.summary = REQUEST_TYPES[t.type].summary(t.fields);
    t.round++;
    transition(t, '承認待ち', by, `再申請（第${t.round}回）`);
    autolog(t, 'A1 承認経路設定', '再申請のため承認経路を再評価');
    setupApprovals(t);
  },
  start(t, by) { transition(t, '対応中', by, '対応開始'); },
  wait(t, by, comment) {
    transition(t, '回答待ち', by, comment);
    t.comments.push({ at: S.now, by, text: comment });
    autolog(t, 'A6 SLA', '回答待ちのため解決SLAを一時停止 / 申請者へ通知');
  },
  reply(t, by, comment) {
    t.comments.push({ at: S.now, by, text: comment });
    transition(t, '対応中', by, '申請者回答');
    autolog(t, 'A6 SLA', '申請者回答により解決SLAを再開');
  },
  done(t, by) {
    transition(t, '完了', by, '完了');
    if (t.parent) {
      const p = find(t.parent);
      if (p && p.children.every(k => find(k).status === '完了') && p.status !== '完了') {
        transition(p, '完了', 'automation', '全子チケット完了');
        autolog(p, 'A5 親子連携', '全子チケット完了のため親チケットを自動完了');
      }
    }
  },
  reassign(t, by, to) {
    const from = t.assignee; t.assignee = to;
    t.history.push({ at: S.now, from: t.status, to: t.status, by, note: `担当変更 ${uname(from)} → ${uname(to)}` });
  },
};

/* ============================================================
   SLA 計算（履歴の滞在区間から算出）
   ============================================================ */
function timeIn(t, statuses) {
  let sum = 0;
  t.history.forEach((h, i) => {
    if (h.from === h.to) return;
    if (!statuses.includes(h.to)) return;
    const next = t.history.slice(i + 1).find(x => x.from !== x.to);
    sum += (next ? next.at : S.now) - h.at;
  });
  return sum;
}
function slaInfo(t) {
  const out = {};
  if (t.type !== 'task') {
    const el = timeIn(t, ['承認待ち']), target = S.master.sla.approvalH * H;
    out.approval = { el, target, state: t.status === '承認待ち' ? 'run' : 'stop' };
  }
  const started = t.history.some(h => ['未着手', '対応中'].includes(h.to));
  if (started) {
    const el = timeIn(t, ['未着手', '対応中']), target = S.master.sla.resolveH * H;
    const state = ['未着手', '対応中'].includes(t.status) ? 'run' : t.status === '回答待ち' ? 'pause' : 'stop';
    out.resolve = { el, target, state };
  }
  for (const k in out) out[k].breached = out[k].el > out[k].target;
  return out;
}
function slaBadges(t) {
  const s = slaInfo(t), parts = [];
  const one = (lbl, x) => {
    if (!x) return;
    let cls = x.breached ? 'bad' : x.el > x.target * 0.75 ? 'warn' : 'ok';
    if (x.state === 'pause') cls = 'pause';
    if (x.state === 'stop' && !x.breached) cls = 'stop';
    const st = x.state === 'pause' ? ' 停止中' : x.state === 'stop' ? ' 終了' : '';
    parts.push(`<span class="sla ${cls}" title="${lbl}SLA 目標 ${fmtDur(x.target)}">${lbl} ${fmtDur(x.el)}/${fmtDur(x.target)}${x.breached ? ' 超過' : ''}${st}</span>`);
  };
  one('承認', s.approval); one('解決', s.resolve);
  return parts.join('') || '<span class="muted small">-</span>';
}

/* ============================================================
   権限
   ============================================================ */
function canView(t, u) {
  if (has(u, 'admin')) return true;
  if (t.reporter === u || t.assignee === u) return true;
  if ([...t.approvals, ...t.pastApprovals].some(a => a.approver === u)) return true;
  if (t.children.some(k => find(k)?.assignee === u)) return true; // 子の担当者は親を参照可
  return false;
}
function actionsFor(t, u) {
  const a = [];
  const cur = t.approvals[t.approvalIdx];
  if (t.status === '承認待ち' && cur && (cur.approver === u)) a.push('approve', 'sendBack', 'reject');
  if (t.status === '差戻し' && t.reporter === u) a.push('resubmit');
  const mine = t.assignee === u || has(u, 'admin');
  if (t.status === '未着手' && mine) a.push('start');
  if (t.status === '対応中' && mine && t.type !== 'production') a.push('wait', 'done');
  if (t.status === '回答待ち' && t.reporter === u) a.push('reply');
  if (has(u, 'admin') && OPEN.includes(t.status) && t.assignee) a.push('reassign');
  return a;
}

function renderForm(type, values, scope, errors) {
  const def = REQUEST_TYPES[type];
  let h = '';
  for (const f of visibleFields(type, values)) {
    const v = values[f.id] ?? '';
    const attr = `data-scope="${scope}" data-field="${f.id}"`;
    let input;
    if (f.type === 'select') input = `<select ${attr}><option value="">選択してください</option>${f.options.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea ${attr}>${esc(v)}</textarea>`;
    else input = `<input type="${f.type}" value="${esc(v)}" ${attr}>`;
    h += `<div class="form-row"><label>${f.label}${f.req ? '<span class="req">*</span>' : ''}${f.showIf ? ` <span class="muted small">（${f.showIf.field === 'media' ? '媒体' : '対象システム'}=${f.showIf.eq} の場合のみ表示）</span>` : ''}</label>${input}</div>`;
  }
  if (type === 'purchase') {
    const big = Number(values.amount) >= S.master.threshold;
    h += `<div class="notice ${big ? 'warn' : ''}" id="routeHint-${scope}">${routeHint(values)}</div>`;
  }
  if (errors?.length) h += `<div class="err">${errors.map(esc).join('<br>')}</div>`;
  return h;
}
function routeHint(values) {
  const big = Number(values.amount) >= S.master.threshold;

}

/* ---- ダッシュボード ---- */
function viewDash() {
  const T = S.tickets, open = T.filter(t => OPEN.includes(t.status));
  const sl = T.map(t => [t, slaInfo(t)]);
  const brA = sl.filter(([t, s]) => s.approval?.breached && t.status === '承認待ち');
  const brR = sl.filter(([t, s]) => s.resolve?.breached && OPEN.includes(t.status));
  const doneT = T.filter(t => t.status === '完了' && t.type !== 'task');
  const lead = doneT.length ? doneT.reduce((a, t) => a + (t.history.at(-1).at - t.created), 0) / doneT.length : 0;
  // 状態別の滞留（現在の状態に入ってからの経過）
  const ageInStatus = t => { const h = [...t.history].reverse().find(x => x.from !== x.to); return S.now - h.at; };
  const byStatus = OPEN.map(s => { const xs = open.filter(t => t.status === s); return { s, n: xs.length, avg: xs.length ? xs.reduce((a, t) => a + ageInStatus(t), 0) / xs.length : 0 }; });
  const maxN = Math.max(1, ...byStatus.map(x => x.n));
  const byAssignee = {};
  open.filter(t => t.assignee).forEach(t => byAssignee[t.assignee] = (byAssignee[t.assignee] || 0) + 1);
  const maxA = Math.max(1, ...Object.values(byAssignee));
  // 工程別処理時間（子チケット：対応中の累計）
  const proc = {};
  T.filter(t => t.type === 'task').forEach(t => { const p = t.fields.工程; (proc[p] ||= []).push(timeIn(t, ['対応中'])); });

  // 計測結果に基づく改善提案
  const tips = [];
  if (brA.length) tips.push(`承認SLA超過 ${brA.length} 件（承認者：${[...new Set(brA.map(([t]) => uname(t.approvals[t.approvalIdx].approver)))].join('、')}）。→ 4時間経過時の再通知Automation追加、不在時の代理承認設定の運用徹底、部長承認閾値（現 ${yen(S.master.threshold)}）の見直しを提案。`);
  const worst = byStatus.filter(x => x.n).sort((a, b) => b.avg - a.avg)[0];
  if (worst) tips.push(`最も滞留している状態は「${worst.s}」（平均 ${fmtDur(worst.avg)}・${worst.n}件）。`);
  const waiting = open.filter(t => t.status === '回答待ち').length;
  if (waiting) tips.push(`回答待ち ${waiting} 件。→ 24h無応答で申請者へリマインド、5営業日で自動クローズするルールを提案。`);
  const sb = open.filter(t => t.status === '差戻し').length;
  if (sb) tips.push(`差戻し中 ${sb} 件。→ 差戻し理由を選択式フィールド化して集計し、フォームの説明文・入力チェックへ反映。`);
  const ent = Object.entries(byAssignee).sort((a, b) => b[1] - a[1]);
  if (ent.length > 1 && ent[0][1] >= 2 * ent.at(-1)[1]) tips.push(`担当者の偏り：${uname(ent[0][0])} に ${ent[0][1]} 件集中。→ グループ内ラウンドロビン割当を検討。`);

  const kpi = (n, l, bad) => `<div class="kpi ${bad ? 'bad' : ''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  return `<div class="kpis">
      ${kpi(open.length, '未完了チケット')}
      ${kpi(T.filter(t => t.status === '承認待ち').length, '承認待ち')}
      ${kpi(brA.length, '承認SLA超過', brA.length)}
      ${kpi(brR.length, '解決SLA超過', brR.length)}
      ${kpi(doneT.length ? fmtDur(lead) : '-', '平均リードタイム（申請→完了）')}
    </div>
    <div class="grid2">
      <div class="card"><h2>状態別の滞留</h2><code class="jql">project = REQ AND statusCategory != Done</code>
        ${byStatus.map(x => `<div class="bar"><span>${x.s}</span><div class="track"><div class="fill" style="width:${x.n / maxN * 100}%"></div></div><span class="small">${x.n}件 / 平均 ${fmtDur(x.avg)}</span></div>`).join('')}
        <h3>担当者別の未完了</h3><code class="jql">project = REQ AND statusCategory != Done AND assignee is not EMPTY</code>
        ${Object.entries(byAssignee).map(([a, n]) => `<div class="bar"><span class="small">${esc(uname(a))}</span><div class="track"><div class="fill" style="width:${n / maxA * 100}%"></div></div><span class="small">${n}件</span></div>`).join('') || '<p class="muted">なし</p>'}
      </div>
      <div class="card"><h2>計測に基づく改善提案</h2>
        ${tips.length ? `<ul>${tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="muted">現時点で大きな課題はありません。</p>'}
        <h3>工程別 作業時間（子チケットの対応中累計）</h3>
        <table><tr><th>工程</th><th>件数</th><th>平均</th></tr>${Object.entries(proc).map(([p, xs]) => `<tr><td>${esc(p)}</td><td>${xs.length}</td><td>${fmtDur(xs.reduce((a, b) => a + b, 0) / xs.length)}</td></tr>`).join('')}</table>
      </div>
    </div>
    <div class="card"><h2>SLA超過・期限超過一覧</h2>
      <code class="jql">project = REQ AND ("承認までの時間" = breached() OR "解決までの時間" = breached()) AND statusCategory != Done</code>
      ${[...brA, ...brR].length ? `<div class="tbl"><table><tr><th>キー</th><th>概要</th><th>状態</th><th>担当／承認者</th><th>SLA</th></tr>${[...new Map([...brA, ...brR].map(x => [x[0].key, x[0]])).values()].map(t => `<tr class="click" data-act="gotoTicket" data-key="${t.key}"><td>${t.key}</td><td>${esc(t.summary)}</td><td><span class="st st-${t.status}">${t.status}</span></td><td class="small">${esc(uname(t.status === '承認待ち' ? t.approvals[t.approvalIdx].approver : t.assignee))}</td><td>${slaBadges(t)}</td></tr>`).join('')}</table></div>` : '<p class="muted">超過なし</p>'}
    </div>
    <div class="card"><h2>その他の集計JQL例</h2>
      <code class="jql">-- 承認待ちのまま1日以上経過
project = REQ AND status = "承認待ち" AND NOT status changed during (-1d, now())</code>
      <code class="jql">-- 直近30日の差戻し発生チケット（差戻し率の算出用）
project = REQ AND status was "差戻し" AND created >= -30d</code>
      <code class="jql">-- 期限（希望納期）超過の制作依頼
project = REQ AND "Request Type" = "制作依頼" AND "希望納期" < now() AND statusCategory != Done</code>
      <code class="jql">-- 工程別の未完了子チケット
project = REQ AND issuetype = Sub-task AND "工程" = "デザイン" AND statusCategory != Done</code>
    </div>`;
}

/* ---- マスタ管理 ---- */
function viewMaster() {

  return `<div class="notice">Automation ルールは担当者名を直接持たず、このマスタを参照するだけの設計です。人事異動・担当替えは<b>マスタ変更のみ</b>で反映され、ルール改修は不要です。本番では Assets（またはグループ・カスタムフィールド）で保持します。</div>
  <div class="grid2">
    <div class="card"><h2>承認者マスタ</h2>
      <table><tr><th>役割</th><th>承認者</th><th>不在</th><th>代理承認者</th></tr>
      ${['manager', 'director'].map(r => { const uid = m.approvers[r]; return `<tr><td>${r === 'manager' ? '課長承認' : '部長承認'}</td><td>${userSel('approvers.' + r, uid, 'approver')}</td>
        <td><input type="checkbox" data-master="absent.${uid}" ${m.absent[uid] ? 'checked' : ''}></td><td>${userSel('proxy.' + uid, m.proxy[uid], 'approver')}</td></tr>`; }).join('')}</table>
      <h3>承認条件</h3>
      <div class="form-row"><label>部長承認を追加する金額閾値（円）</label><input type="number" data-master="threshold" value="${m.threshold}"></div>
      <h3>SLA目標</h3>
      <div class="form-row"><label>承認SLA（時間）</label><input type="number" data-master="sla.approvalH" value="${m.sla.approvalH}"></div>
      <div class="form-row"><label>解決SLA（時間）</label><input type="number" data-master="sla.resolveH" value="${m.sla.resolveH}"></div>

    </div>

  <div class="card"><h2>マスタ変更履歴</h2>
    ${S.masterLog.length ? `<table><tr><th>日時</th><th>変更者</th><th>項目</th><th>変更前</th><th>変更後</th></tr>${S.masterLog.slice().reverse().map(l => `<tr><td>${fmtTime(l.at)}</td><td>${esc(uname(l.by))}</td><td><code>${esc(l.path)}</code></td><td>${esc(l.from)}</td><td>${esc(l.to)}</td></tr>`).join('')}</table>` : '<p class="muted">変更なし。値を変更すると記録されます（設定変更履歴の管理）。</p>'}

function viewAutolog() {
  const rows = S.autolog.slice().sort((a, b) => b.at - a.at).slice(0, 80);
  return `<div class="card"><details ${ui.tab === 'design' ? '' : 'open'}><summary>Automation 実行ログ（${S.autolog.length}件）</summary>
    <div class="log">${rows.map(l => `<div>${fmtTime(l.at)} <span class="rule">${esc(l.rule)}</span> ${l.key} — ${esc(l.msg)}</div>`).join('')}</div></details></div>`;
}

/* ============================================================
   イベント
   ============================================================ */
function commit(msg) { save(); if (msg) ui.flash = msg; render(); }
function comment() { return (document.getElementById('actComment')?.value || '').trim(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT') return;
  e.preventDefault();
  const act = el.dataset.act, t = el.dataset.key ? find(el.dataset.key) : null, u = ui.user;
  const need = (fn) => { const c = comment(); if (!c) { alert('コメントを入力してください'); return; } fn(c); };
  switch (act) {
    case 'tab': ui.tab = el.dataset.id; ui.edit = null; ui.errors = []; render(); break;
    case 'select': ui.sel = el.dataset.key; ui.edit = null; ui.errors = []; render(); break;
    case 'gotoTicket': ui.tab = 'all'; ui.sel = el.dataset.key; render(); break;
    case 'formtype': ui.formType = el.dataset.id; ui.form = {}; ui.errors = []; render(); break;
    case 'clock': S.now += Number(el.dataset.h) * H; commit(); break;
    case 'reset': if (confirm('デモデータを初期状態に戻します。よろしいですか？')) { seed(); ui.sel = null; commit('初期データに戻しました'); } break;
    case 'submit': {
      ui.errors = validate(ui.formType, ui.form);
      if (ui.errors.length) { render(); break; }
      const nt = A.create(ui.formType, ui.form, u);
      ui.form = {}; ui.sel = nt.key; ui.tab = 'mine';
      commit(`${nt.key} を申請しました。承認者：${uname(nt.approvals[0].approver)}`); break;
    }
    case 'approve': A.approve(t, u, comment()); commit(`${t.key} を承認しました`); break;
    case 'sendBack': need(c => { A.sendBack(t, u, c); commit(`${t.key} を差戻しました`); }); break;
    case 'reject': need(c => { A.reject(t, u, c); commit(`${t.key} を却下しました`); }); break;
    case 'start': A.start(t, u); commit(); break;
    case 'wait': need(c => { A.wait(t, u, c); commit(`${t.key} を回答待ちにしました（SLA停止）`); }); break;
    case 'reply': need(c => { A.reply(t, u, c); commit(`${t.key} に回答しました（SLA再開）`); }); break;
    case 'done': A.done(t, u); commit(`${t.key} を完了しました`); break;
    case 'resubmit': ui.edit = t.key; ui.form = { ...t.fields }; ui.errors = []; render(); break;
    case 'resubmitGo':
      ui.errors = validate(t.type, ui.form);
      if (ui.errors.length) { render(); break; }
      A.resubmit(t, ui.form, u); ui.edit = null; ui.form = {}; commit(`${t.key} を再申請しました`); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.scope) {
    ui.form[el.dataset.field] = el.value;
    if (el.dataset.field === 'amount') {
      const hint = document.getElementById('routeHint-' + el.dataset.scope);
      if (hint) { hint.innerHTML = routeHint(ui.form); hint.classList.toggle('warn', Number(el.value) >= S.master.threshold); }
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'userSel') { ui.user = el.value; ui.sel = null; ui.edit = null; ui.form = {}; ui.errors = []; render(); return; }
  if (el.dataset.scope && el.tagName === 'SELECT') { ui.form[el.dataset.field] = el.value; render(); return; }
  if (el.dataset.actChange === 'reassign') { const t = find(el.dataset.key); A.reassign(t, ui.user, el.value); commit(`${t.key} の担当を変更しました`); return; }
  if (el.dataset.master) {
    const path = el.dataset.master.split('.');
    let o = S.master; for (const k of path.slice(0, -1)) o = o[k];
    const last = path.at(-1), from = o[last];
    const to = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
    o[last] = to;
    const show = v => typeof v === 'boolean' ? (v ? '不在' : '在席') : (USERS[v]?.name ?? v);
    S.masterLog.push({ at: S.now, by: ui.user, path: el.dataset.master, from: show(from), to: show(to) });
    commit('マスタを更新しました（Automationルールの変更は不要）');
  }
});

/* 起動 */
if (!load()) { seed(); save(); }
render();
</script>
